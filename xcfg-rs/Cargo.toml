[package]
name = "xcfg-rs"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "A simple configuration file parser for Rust"
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "xcfg"
path = "src/lib.rs"

[features]
default = ["toml"]
derive = ["dep:xcfg-derive"]
toml = ["dep:toml"]
yaml = ["dep:serde_yml"]
json = ["dep:serde_json"]
full = ["derive", "toml", "yaml", "json"]

[dependencies]
xcfg-derive = { workspace = true, optional = true }
serde = { workspace = true }
serde_yml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
scopeguard = { version = "1.2" }

[lints]
workspace = true

[[test]]
name = "any-test"
path = "tests/any_test.rs"
required-features = ["full"]

[[test]]
name = "toml-test"
path = "tests/toml_test.rs"
required-features = ["toml", "derive"]

[[test]]
name = "yaml-test"
path = "tests/yaml_test.rs"
required-features = ["yaml", "derive"]

[[test]]
name = "json-test"
path = "tests/json_test.rs"
required-features = ["json", "derive"]

[[test]]
name = "load-test"
path = "tests/load.rs"
required-features = ["full"]

[[test]]
name = "reader-writer-test"
path = "tests/reader_writer_test.rs"
required-features = ["full"]

[[example]]
name = "full"
path = "example/full.rs"
required-features = ["full"]
